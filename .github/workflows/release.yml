name: Release userscript

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Compute release name
        id: ver
        run: echo "name=$(date -u +%Y.%m.%d).${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test

      - name: Build
        run: npm run build
        env:
          USERSCRIPT_VERSION: ${{ steps.ver.outputs.name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.ver.outputs.name }}
        run: |
          gh release create "build-${{ github.run_id }}" dist/moazine-web-viewer.user.js \
            --target "$GITHUB_SHA" \
            --title "$NAME" \
            --notes "Commit ${GITHUB_SHA::7}: $(git log -1 --format=%s "$GITHUB_SHA")" \
            --latest
